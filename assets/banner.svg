<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic motion in background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes particleDrift1 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(35px, -20px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes particleDrift2 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-30px, 25px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -200; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .ambient-orb1 {
      animation: pulseGlow 8s ease-in-out infinite, particleDrift1 12s ease-in-out infinite;
      transform-origin: 250px 100px;
    }
    .ambient-orb2 {
      animation: pulseGlow 10s ease-in-out infinite 2s, particleDrift2 14s ease-in-out infinite;
      transform-origin: 950px 240px;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashTravel 15s linear infinite;
    }
    .float-item-1 {
      animation: floatPill 6s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatPill 6s ease-in-out infinite 1.5s;
    }
    .float-item-3 {
      animation: floatPill 6s ease-in-out infinite 3s;
    }
    .float-item-4 {
      animation: floatPill 6s ease-in-out infinite 4.5s;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.7">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic Glowing Orbs (Strictly in Background) -->
  <circle class="ambient-orb1" cx="220" cy="90" r="130" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="ambient-orb2" cx="980" cy="230" r="150" fill="#818cf8" opacity="0.22" filter="url(#glow)" />
  <circle cx="600" cy="310" r="100" fill="#c084fc" opacity="0.15" filter="url(#glow)" />

  <!-- Background Data Flow Curved Lines -->
  <g fill="none" opacity="0.35">
    <path class="flow-line" d="M -50,290 C 300,320 400,220 700,260 C 950,290 1050,150 1250,180" stroke="url(#accentGradient)" stroke-width="2" />
    <path class="flow-line" d="M -50,120 C 250,70 450,160 800,90 C 1000,50 1100,120 1250,80" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Top Accent Highlight Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGradient)" />

  <!-- Foreground Content Container -->
  <!-- Tagline Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
    <text x="28" y="20" class="badge-text" fill="#38bdf8">OMNICHANNEL ENGAGEMENT ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="60" y="132" class="title-text">
    Awesome Digital Customer Engagement
  </text>

  <!-- Foreground Subtitle -->
  <text x="60" y="174" class="subtitle-text">
    Curated SaaS Platforms, Open-Source Engines &amp; Journey Orchestration Frameworks
  </text>
  <text x="60" y="202" class="subtitle-text" font-size="16" fill="#64748b">
    Push Notifications • SMS/RCS • Email Marketing • In-App Messaging • WhatsApp • Real-Time CDPs
  </text>

  <!-- Interactive/Dynamic Ecosystem Feature Badges (Bottom Row) -->
  <g transform="translate(60, 246)">
    <!-- Pill 1: Push & In-App -->
    <g class="float-item-1" transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" class="badge-text">Mobile &amp; Web Push</text>
    </g>

    <!-- Pill 2: Journey Builder -->
    <g class="float-item-2" transform="translate(196, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" class="badge-text">Journey Orchestration</text>
    </g>

    <!-- Pill 3: Messaging & WhatsApp -->
    <g class="float-item-3" transform="translate(397, 0)">
      <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#34d399" />
      <text x="36" y="26" class="badge-text">SMS, RCS &amp; WhatsApp</text>
    </g>

    <!-- Pill 4: Open Source & Self-Host -->
    <g class="float-item-4" transform="translate(608, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#c084fc" />
      <text x="36" y="26" class="badge-text">Open-Source &amp; CDPs</text>
    </g>

    <!-- Pill 5: AI Personalization -->
    <g class="float-item-1" transform="translate(814, 0)">
      <rect width="200" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#f43f5e" />
      <text x="36" y="26" class="badge-text">AI Agents &amp; Decisioning</text>
    </g>
  </g>
</svg>
